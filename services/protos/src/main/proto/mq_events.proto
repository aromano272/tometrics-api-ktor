syntax = "proto3";

option java_package = "com.tometrics.api.services.protos";
option java_multiple_files = true;

message Event {
  oneof content {
    PostCreated postCreated = 1;
    CommentCreated commentCreated = 2;
  }
}

message PostCreated {
  int32 postId = 1;
  EventUser user = 2;
  string text = 3;
}

message CommentCreated {
  int32 commentId = 1;
  int32 postId = 2;
  int32 postUserId = 3;
  EventUser user = 4;
  string text = 5;
}

message EventUser {
  int32 id = 1;
  string name = 2;
}